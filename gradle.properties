#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#PharmaSoft (Sesión 14)
# Dirección del backend que se compila dentro de la app (BuildConfig.PHARMASOFT_URL).
# Emulador: 10.0.2.2. Teléfono real: la IP del PC en la red local, por ejemplo
# http://192.168.1.40:8080/api/v1/ (y agrega esa IP en res/xml/network_security_config.xml).
pharmasoft.url=http://10.0.2.2:8080/api/v1/
